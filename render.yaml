# Render Blueprint — deploy Adventum Pharma as a Node Web Service.
# In Render: New + → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: adventum-pharma
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/adventum-pharma-website-q7ovlt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /
    envVars:
      # Next.js `next start` binds to Render's injected PORT automatically.
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production

      # Canonical origin used by metadata, sitemap, robots, RSS and JSON-LD.
      # The apex serves the site; www.adventumdz.com answers with a permanent
      # redirect to it (measured 30/09/2026). A canonical link must point at
      # the final address, never at a redirect.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://adventumdz.com

      # Admin area (/admin). Until ADMIN_PASSWORD is set the admin refuses
      # every login — there is deliberately no default password.
      # Set both values in the Render dashboard, never in this file.
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false

      # The link with the ERP, both ways: the ERP publishes jobs and articles
      # here (/api/v1/*), and the site sends back the applications it
      # receives and reloads its content from the ERP when it starts.
      #
      # These three values are GENERATED BY THE ERP (Site web › Connexion au site ›
      # "Générer la clé"), which shows them as one block. Paste that block,
      # as is, in Render → Environment → "Add from .env", then "Save, rebuild,
      # and deploy". Not "Save only" (nothing would change), nor "Save and
      # deploy": per Render's documentation it redeploys the EXISTING build,
      # which may be an older version of this site. Nothing to invent, nothing
      # to copy by hand. The ERP notices by itself when the site has the new key
      # and switches over without a cut.
      #
      # Never write them in this file: the repository is public, and the key
      # gives the right to publish on the public site.
      - key: ERP_API_KEY
        sync: false
      - key: ERP_WEBHOOK_SECRET
        sync: false
      - key: ERP_BASE_URL
        sync: false

      # Where the site writes what it holds at runtime (jobs, ERP articles,
      # applications not yet delivered). If this directory cannot be written
      # (no disk attached), the site uses ./data, then the temporary
      # directory, and says so in /api/v1/health.
      - key: JOBS_DATA_DIR
        value: /var/data

    # A persistent disk is OPTIONAL since the site reloads its content from
    # the ERP on every start. It is still needed for two things:
    #   - postings typed in this site's own /admin (not in the ERP) survive a
    #     restart only on a disk;
    #   - an application that could not reach the ERP yet (ERP asleep or
    #     redeploying) waits on the disk; without one, a restart during that
    #     wait loses it. The site tries to deliver it the moment it is sent,
    #     and every minute after, so the window is short.
    # Render's free plan has no disks. Upgrade the plan and uncomment this
    # block to close both gaps.
    #
    # disk:
    #   name: adventum-data
    #   mountPath: /var/data
    #   sizeGB: 1
